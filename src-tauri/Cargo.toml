[package]
name = "filesync"
version = "0.1.0"
description = "文件夹内容比对工具（SHA256，不依赖文件名）"
edition = "2021"

[lib]
name = "filesync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sha2 = "0.10"
rayon = "1.10"

# 体积优化：小体积单 exe
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
